name: Build, test, publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.version_check.outputs.current_version }}
      previous_version: ${{ steps.version_check.outputs.previous_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.9.0"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check version
        id: version_check
        run: |
          sudo apt-get install -y jq
          echo "current_version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
          echo "previous_version=$(yarn npm info $(jq -r .name package.json) -f version --json | jq -r .version)" >> $GITHUB_OUTPUT

  # Would like to trigger this separately on release published,
  # but would need to give release-please a custom PAT so it can recursively trigger workflows
  publish:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: ${{ needs.build_and_test.outputs.current_version != needs.build_and_test.outputs.previous_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.9.0"
          cache: "yarn"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to npm
        run: yarn npm publish --access public
